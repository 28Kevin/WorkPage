# Plantilla de nginx para Render. El entrypoint sustituye __PORT__ por $PORT y
# escribe el resultado en /etc/nginx/nginx.conf.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 20M;

    # El usuario www-data no puede escribir en /var/lib/nginx.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/pdf;
    gzip_min_length 1024;

    server {
        listen __PORT__;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;

            # El PDF con QR puede tardar mas que el default.
            fastcgi_read_timeout 120;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
