name: examenes-medicos

services:
  # ---------------------------------------------------------------- PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: emo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-examenes_medicos}
      POSTGRES_USER: ${DB_USERNAME:-examenes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/Bogota
    ports:
      - '${DB_PORT_HOST:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-examenes} -d ${DB_DATABASE:-examenes_medicos}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [emo]

  # ------------------------------------------------------- API Laravel (PHP-FPM)
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: emo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:${APP_PORT:-8000}
      APP_PORT: ${APP_PORT:-8000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-examenes_medicos}
      DB_USERNAME: ${DB_USERNAME:-examenes}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@centromedico.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
    volumes:
      - ../backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    networks: [emo]

  # ------------------------------------------------------------ Nginx (API HTTP)
  nginx:
    image: nginx:1.27-alpine
    container_name: emo-nginx
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - '${APP_PORT:-8000}:80'
    volumes:
      - ../backend:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [emo]

  # ------------------------------------------------------------- SPA Vue 3 (Vite)
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: emo-frontend
    restart: unless-stopped
    depends_on: [nginx]
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_BASE_URL: http://localhost:${APP_PORT:-8000}/api
      VITE_APP_NAME: ${MEDICAL_CENTER_NAME:-Centro Médico Ocupacional}
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ../frontend:/app
      # node_modules aislado: los binarios nativos del host no sirven en Linux.
      - frontend-node-modules:/app/node_modules
    networks: [emo]

volumes:
  db-data:
  backend-vendor:
  frontend-node-modules:

networks:
  emo:
    driver: bridge
